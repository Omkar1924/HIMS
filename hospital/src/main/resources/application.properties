spring.application.name=hospital
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hims_db
spring.datasource.username=postgres
spring.datasource.password=omkar123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# port
server.port=8085

# Public API (development / demo only)
# Public spell-check API (LanguageTool) used for autocorrection in templates.
# NOTE for future maintainers: this is a free public demo endpoint.
# - It can go down at any time without notice.
# - It is subject to rate/token limits; heavy template usage may be throttled.
# - Do not rely on it for production-critical flows without a fallback or a paid/self-hosted instance.
spellcheck.url=https://api.languagetool.org/v2/check
spellcheck.language=en-US

# Words that must never be auto-corrected (drug names, hospital terms), lowercase, comma separated
spellcheck.ignore=ceftriaxone,pantoprazole,ondansetron,enoxaparin